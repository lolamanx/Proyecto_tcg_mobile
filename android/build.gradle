plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'cl.cardfolio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.cardfolio.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets.main.assets.srcDirs = [rootProject.file('../public')]
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

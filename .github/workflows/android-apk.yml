name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "public/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardfolio-android-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-preview-${{ github.run_number }}
          name: Cardfolio APK de prueba #${{ github.run_number }}
          body: "APK de prueba generado desde ${{ github.sha }}."
          prerelease: true
          make_latest: false
          files: android/build/outputs/apk/debug/*.apk

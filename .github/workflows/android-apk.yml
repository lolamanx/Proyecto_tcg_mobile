name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/audit-editions.py"
      - "data/**"
      - "public/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Read a sample scan from each edition
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn python3-pil
          OMP_THREAD_LIMIT=1 /usr/bin/python3 scripts/audit-editions.py
      - name: Bundle offline scanner
        run: |
          bash scripts/prepare-scanner.sh
          ln -s public/ocr ocr
      - name: Verify pending review flow
        run: |
          python3 -m venv /tmp/cardfolio-review
          /tmp/cardfolio-review/bin/pip install -q playwright==1.56.0
          node server.mjs &
          trap 'kill $!' EXIT
          /tmp/cardfolio-review/bin/python scripts/check-pending.py
          /tmp/cardfolio-review/bin/python scripts/check-scanner.py
      - name: Compile APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardfolio-android-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-preview-${{ github.run_number }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Cardfolio APK de prueba" --notes "Compilación $GITHUB_SHA" --prerelease
          for attempt in 1 2 3; do
            if gh release upload "$TAG" android/build/outputs/apk/debug/*.apk ediciones.csv --clobber; then exit 0; fi
            sleep 3
          done
          exit 1

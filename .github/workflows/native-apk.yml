name: Cardfolio Nativo
on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JeremyMCastillo/pk-scan
          ref: d5a25ad09499a69db9edcc288e5273159ce3b10d
          path: pk
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Adapt and verify
        working-directory: pk
        run: |
          cp -r ../native/overlay/. .
          npm ci
          npm run typecheck
          npm run lint
          npm run verify
          npx expo prebuild --platform android --no-install
      - name: Build standalone APK
        working-directory: pk/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --max-workers=2
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pk/android/app/build/outputs/apk/release/app-release.apk Cardfolio-Nativo.apk
          gh release create "nativo-${GITHUB_RUN_NUMBER}" Cardfolio-Nativo.apk --target "$GITHUB_SHA" --prerelease --title "Cardfolio Nativo" --notes "Adaptación Android de PK Scan con captura automática."

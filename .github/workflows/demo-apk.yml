name: Demo Android
on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/demo-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p demo assembleDebug
      - run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: bash demo/smoke.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp demo/build/outputs/apk/debug/*.apk Cardfolio-Demo.apk
          gh release create "demo-$GITHUB_RUN_NUMBER" Cardfolio-Demo.apk inicio.png --target "$GITHUB_SHA" --prerelease --title "Cardfolio Demo 0.1" --notes "Escáner local de números de colección. Arranque verificado en Android 11."
